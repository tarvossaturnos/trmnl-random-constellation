<style>
  .layout-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }

  .map-area {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 56px;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 20px;
    box-sizing: border-box;
    overflow: hidden;
  }

  .constellation-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .title-bar {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 56px;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    padding: 5px 14px;
    box-sizing: border-box;
    background: #ffffff;
    border-top: 1px solid #b5b5b5;
  }

  .title-text {
    color: #000000;
    font-family: sans-serif;
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
  }

  .subtitle-text {
    margin-left: 6px;
    color: #555555;
    font-size: 14px;
    font-style: italic;
  }

  .description-text {
    width: 100%;
    margin-top: 2px;
    overflow: hidden;
    color: #555555;
    font-size: 12px;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
</style>

<div class="layout-container">
  <div class="map-area">
    <img class="constellation-image" src="{{ image }}" alt="{{ name }}">
  </div>

  <div class="title-bar">
    <span class="title-text">{{ name }}</span>
    <span class="subtitle-text">({{ latin }})</span>
    <span class="description-text">{{ description }}</span>
  </div>
</div>
