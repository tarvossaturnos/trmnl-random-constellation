<style>
  .layout-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }

  .map-area {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 23.34%;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3% 2.5%;
    box-sizing: border-box;
    overflow: hidden;
  }

  .constellation-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .title-bar {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 23.34%;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    padding: 1% 1.75%;
    box-sizing: border-box;
    background: #ffffff;
    border-top: 1px solid #b5b5b5;
  }

  .title-text {
    color: #000000;
    font-family: sans-serif;
    font-size: clamp(20px, min(5vw, 8.34vh), 40px);
    font-weight: bold;
    line-height: 1.05;
    white-space: nowrap;
  }

  .subtitle-text {
    align-self: baseline;
    margin-left: clamp(6px, 1.5vw, 12px);
    color: #555555;
    font-size: clamp(14px, min(3.5vw, 5.84vh), 28px);
    font-style: italic;
    line-height: 1.05;
  }

  .description-text {
    width: 100%;
    margin-top: 2px;
    overflow: hidden;
    color: #555555;
    font-size: clamp(7px, min(1.5vw, 2.5vh), 12px);
    white-space: nowrap;
    text-overflow: ellipsis;
  }
</style>

<div class="layout-container">
  <div class="map-area">
    <img class="constellation-image" src="{{ image }}" alt="{{ name }}">
  </div>

  <div class="title-bar">
    <span class="title-text">{{ name }}</span>
    <span class="subtitle-text">({{ latin }})</span>
    <span class="description-text">{{ description }}</span>
  </div>
</div>
